[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=aoi_lib
    --cov=consumo_lib
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=1

markers =
    unit: Testes unitarios (rápidos, sem dependências externas)
    integration: Testes de integração (com mocks ou dependências)
    slow: Testes lentos (maior que 1 segundo)
    hardware: Testes que requerem hardware físico
    gpu: Testes que requerem GPU
    network: Testes que requerem rede

[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */.venv/*
    */__pycache__/*
    */site-packages/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
