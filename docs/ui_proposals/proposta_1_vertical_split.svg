<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Proposta 1: Divisão Vertical com Aba "Medição de Tensão" -->
  <!-- Layout dividido: Lista de Stencils à esquerda (40%), Visualização de Tensão à direita (60%) -->

  <!-- Fundo -->
  <rect width="1200" height="800" fill="#1B2633"/>

  <!-- Título da Aba -->
  <text x="20" y="35" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" fill="#FFFFFF">📊 Medição de Tensão</text>

  <!-- ==================== PAINEL ESQUERDO - LISTA DE STENCILS (40%) ==================== -->
  <g transform="translate(0, 50)">
    <!-- Fundo do painel -->
    <rect width="480" height="700" fill="#1F2937" stroke="#374151" stroke-width="1"/>

    <!-- Barra de Filtros -->
    <rect x="10" y="10" width="460" height="40" fill="#2D3748" rx="4"/>
    <text x="20" y="35" font-family="Segoe UI, Arial" font-size="13" fill="#9CA3AF">Buscar:</text>
    <rect x="65" y="18" width="180" height="24" fill="#1B2633" rx="3"/>
    <text x="75" y="34" font-family="Segoe UI, Arial" font-size="11" fill="#6B7280">Buscar programas...</text>

    <text x="260" y="35" font-family="Segoe UI, Arial" font-size="13" fill="#9CA3AF">Período:</text>
    <rect x="310" y="18" width="90" height="24" fill="#1B2633" rx="3"/>
    <text x="320" y="34" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB">Últimas 10</text>

    <text x="415" y="35" font-family="Segoe UI, Arial" font-size="13" fill="#9CA3AF">Status:</text>
    <rect x="460" y="18" width="80" height="24" fill="#1B2633" rx="3"/>
    <text x="470" y="34" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB">Todos</text>

    <!-- Lista de Stencils -->
    <rect x="10" y="60" width="460" height="400" fill="#1B2633" rx="4"/>

    <!-- Header da lista -->
    <rect x="10" y="60" width="460" height="30" fill="#374151" rx="4"/>
    <text x="20" y="80" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#FFFFFF">Código</text>
    <text x="120" y="80" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#FFFFFF">Descrição</text>
    <text x="320" y="80" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#FFFFFF">Status</text>
    <text x="400" y="80" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#FFFFFF">Última</text>

    <!-- Items da lista (exemplos) -->
    <rect x="10" y="90" width="460" height="35" fill="#2D3748" opacity="0.5"/>
    <text x="20" y="112" font-family="Segoe UI, Arial" font-size="12" fill="#FFFFFF">STN-001</text>
    <text x="120" y="112" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">Stencil PCB A</text>
    <circle cx="330" cy="107" r="6" fill="#10B981"/>
    <text x="345" y="112" font-family="Segoe UI, Arial" font-size="11" fill="#10B981">Ativo</text>
    <text x="400" y="112" font-family="Segoe UI, Arial" font-size="11" fill="#9CA3AF">28/03 14:30</text>

    <rect x="10" y="125" width="460" height="35" fill="#1B2633"/>
    <text x="20" y="147" font-family="Segoe UI, Arial" font-size="12" fill="#FFFFFF">STN-002</text>
    <text x="120" y="147" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">Stencil PCB B</text>
    <circle cx="330" cy="142" r="6" fill="#F59E0B"/>
    <text x="345" y="147" font-family="Segoe UI, Arial" font-size="11" fill="#F59E0B">Alerta</text>
    <text x="400" y="147" font-family="Segoe UI, Arial" font-size="11" fill="#9CA3AF">27/03 09:15</text>

    <rect x="10" y="160" width="460" height="35" fill="#1B2633"/>
    <text x="20" y="182" font-family="Segoe UI, Arial" font-size="12" fill="#FFFFFF">STN-003</text>
    <text x="120" y="182" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">Stencil PCB C</text>
    <circle cx="330" cy="177" r="6" fill="#10B981"/>
    <text x="345" y="182" font-family="Segoe UI, Arial" font-size="11" fill="#10B981">Ativo</text>
    <text x="400" y="182" font-family="Segoe UI, Arial" font-size="11" fill="#9CA3AF">26/03 16:45</text>

    <!-- Painel de Detalhes (selecionado) -->
    <rect x="10" y="470" width="460" height="180" fill="#2D3748" rx="4"/>
    <text x="20" y="495" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">Detalhes do Stencil</text>

    <text x="20" y="525" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Código:</text>
    <text x="80" y="525" font-family="Segoe UI, Arial" font-size="12" fill="#FFFFFF" font-weight="bold">STN-001</text>

    <text x="20" y="550" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Descrição:</text>
    <text x="90" y="550" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">Stencil PCB A - Revisão 2</text>

    <text x="20" y="575" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Receita:</text>
    <text x="75" y="575" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">recipe_pcb_a_v2.json</text>

    <text x="20" y="600" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Tensão Média:</text>
    <text x="110" y="600" font-family="Segoe UI, Arial" font-size="12" fill="#10B981" font-weight="bold">38.5 N/cm²</text>

    <text x="250" y="525" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Total Medições:</text>
    <text x="350" y="525" font-family="Segoe UI, Arial" font-size="12" fill="#FFFFFF" font-weight="bold">47</text>

    <text x="250" y="550" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Última:</text>
    <text x="305" y="550" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">28/03/2026 14:30</text>

    <text x="20" y="635" font-family="Segoe UI, Arial" font-size="12" fill="#9CA3AF">Observações:</text>
    <text x="20" y="655" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB" font-style="italic">Nenhuma observação registrada.</text>

    <!-- Botão Histórico -->
    <rect x="180" y="665" width="120" height="35" fill="#4B5563" rx="6"/>
    <text x="210" y="687" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#FFFFFF">📜 Histórico</text>
  </g>

  <!-- ==================== PAINEL DIREITO - VISUALIZAÇÃO (60%) ==================== -->
  <g transform="translate(490, 50)">
    <!-- Fundo do painel -->
    <rect width="700" height="700" fill="#1F2937" stroke="#374151" stroke-width="1"/>

    <!-- Barra Superior -->
    <g transform="translate(10, 5)">
      <text x="0" y="20" font-family="Segoe UI, Arial" font-size="16" font-weight="bold" fill="#FFFFFF">Visualização de Tensão</text>

      <!-- Botões -->
      <rect x="450" y="0" width="100" height="30" fill="#059669" rx="4"/>
      <text x="475" y="20" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#FFFFFF">Carregar JSON</text>

      <rect x="560" y="0" width="80" height="30" fill="#4B5563" rx="4"/>
      <text x="580" y="20" font-family="Segoe UI, Arial" font-size="12" fill="#FFFFFF">Recarregar</text>
    </g>

    <!-- Critérios de Aceitação -->
    <rect x="10" y="45" width="680" height="50" fill="#2D3748" rx="6"/>
    <text x="20" y="65" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#9CA3AF">CRITÉRIOS DE ACEITAÇÃO (N/cm²)</text>

    <text x="20" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB">Mín:</text>
    <rect x="45" y="72" width="50" height="20" fill="#1B2633" rx="3"/>
    <text x="55" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#FFFFFF">25,00</text>

    <text x="105" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB">Warn↓:</text>
    <rect x="145" y="72" width="50" height="20" fill="#1B2633" rx="3"/>
    <text x="155" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#FFFFFF">28,00</text>

    <text x="205" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB">Warn↑:</text>
    <rect x="245" y="72" width="50" height="20" fill="#1B2633" rx="3"/>
    <text x="255" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#FFFFFF">42,00</text>

    <text x="305" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#D1D5DB">Máx:</text>
    <rect x="335" y="72" width="50" height="20" fill="#1B2633" rx="3"/>
    <text x="345" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#FFFFFF">45,00</text>

    <rect x="400" y="70" width="90" height="24" fill="#059669" rx="4"/>
    <text x="425" y="86" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#FFFFFF">Usar Receita</text>

    <!-- Canvas de Visualização (Heatmap) -->
    <rect x="10" y="105" width="680" height="450" fill="#1B2633" rx="4"/>

    <!-- Área do canvas com grid e pontos -->
    <g transform="translate(100, 150)">
      <!-- Borda da área -->
      <rect x="0" y="0" width="400" height="300" fill="none" stroke="#4B5563" stroke-width="2" rx="4"/>

      <!-- Grid -->
      <line x1="133" y1="0" x2="133" y2="300" stroke="#374151" stroke-width="1"/>
      <line x1="266" y1="0" x2="266" y2="300" stroke="#374151" stroke-width="1"/>
      <line x1="0" y1="100" x2="400" y2="100" stroke="#374151" stroke-width="1"/>
      <line x1="0" y1="200" x2="400" y2="200" stroke="#374151" stroke-width="1"/>

      <!-- Pontos de tensão (círculos coloridos) -->
      <!-- OK - Verde -->
      <circle cx="66" cy="50" r="18" fill="#10B981" opacity="0.8"/>
      <text x="66" y="55" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">38.2</text>
      <text x="66" y="70" font-family="Arial" font-size="8" fill="#9CA3AF" text-anchor="middle">(10,45)</text>

      <circle cx="200" cy="50" r="18" fill="#10B981" opacity="0.8"/>
      <text x="200" y="55" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">36.5</text>

      <circle cx="333" cy="50" r="18" fill="#10B981" opacity="0.8"/>
      <text x="333" y="55" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">39.1</text>

      <circle cx="66" cy="150" r="18" fill="#10B981" opacity="0.8"/>
      <text x="66" y="155" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">37.8</text>

      <circle cx="200" cy="150" r="18" fill="#10B981" opacity="0.8"/>
      <text x="200" y="155" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">40.2</text>

      <circle cx="333" cy="150" r="18" fill="#10B981" opacity="0.8"/>
      <text x="333" y="155" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">35.9</text>

      <!-- WARNING - Amarelo -->
      <circle cx="66" cy="250" r="18" fill="#F59E0B" opacity="0.8"/>
      <text x="66" y="255" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">27.5</text>

      <circle cx="200" cy="250" r="18" fill="#F59E0B" opacity="0.8"/>
      <text x="200" y="255" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">42.8</text>

      <!-- NOK - Vermelho -->
      <circle cx="333" cy="250" r="18" fill="#EF4444" opacity="0.8"/>
      <text x="333" y="255" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">23.1</text>
    </g>

    <!-- Estatísticas -->
    <rect x="10" y="565" width="680" height="50" fill="#2D3748" rx="4"/>
    <text x="20" y="590" font-family="Segoe UI, Arial" font-size="12" fill="#D1D5DB">
      🟢 OK: 7 (77.8%) | 🟡 WARNING: 2 (22.2%) | 🔴 NOK: 0 (0%) | Total: 9 pontos
    </text>
    <rect x="550" y="572" width="130" height="35" fill="#10B981" rx="6"/>
    <text x="580" y="595" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#FFFFFF">✅ APROVADO</text>

    <!-- Legenda -->
    <rect x="10" y="625" width="680" height="35" fill="#1F2937" rx="4"/>
    <text x="20" y="648" font-family="Segoe UI, Arial" font-size="11" fill="#9CA3AF">
      Tensão: Mín: 23.10 | Máx: 42.80 | Média: 35.68 N/cm² |
      🟢 OK (28-42) | 🟡 WARNING | 🔴 NOK (&lt;25 ou &gt;45)
    </text>
  </g>

  <!-- Hardware Status Bar -->
  <g transform="translate(10, 765)">
    <rect width="230" height="25" fill="#EF444420" rx="4"/>
    <circle cx="15" cy="12.5" r="6" fill="#EF4444"/>
    <text x="28" y="17" font-family="Segoe UI, Arial" font-size="11" fill="#EF4444">CLP: Desconectado</text>

    <rect x="240" width="280" height="25" fill="#EF444420" rx="4"/>
    <circle cx="255" cy="12.5" r="6" fill="#EF4444"/>
    <text x="268" y="17" font-family="Segoe UI, Arial" font-size="11" fill="#EF4444">Tensiômetro: Desconectado</text>

    <rect x="530" width="250" height="25" fill="#EF444420" rx="4"/>
    <circle cx="545" cy="12.5" r="6" fill="#EF4444"/>
    <text x="558" y="17" font-family="Segoe UI, Arial" font-size="11" fill="#EF4444">Câmera: Desconectada</text>
  </g>

  <!-- Label da Proposta -->
  <text x="1190" y="790" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#6B7280" text-anchor="end">PROPOSTA 1: Divisão Vertical Fixa</text>
</svg>
