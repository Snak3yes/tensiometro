          <text x="66" y="239" font-family="Arial" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">27.5</text>

          <circle cx="200" cy="233" r="15" fill="#10B981" opacity="0.8"/>
          <text x="200" y="239" font-family="Arial" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">38.7</text>

          <circle cx="333" cy="233" r="15" fill="#10B981" opacity="0.8"/>
          <text x="333" y="239" font-family="Arial" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">36.4</text>
