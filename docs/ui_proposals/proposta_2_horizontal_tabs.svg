<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Proposta 2: Layout com Sub-Abas (Stencils | Visualização) dentro de "Medição de Tensão" -->
  <!-- Aba principal única com duas sub-abas para navegação rápida -->

  <!-- Fundo -->
  <rect width="1200" height="800" fill="#1B2633"/>

  <!-- Título da Aba Principal -->
