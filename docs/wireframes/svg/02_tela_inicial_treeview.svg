<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; fill: #1976D2; }
      .subtitle { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 400; fill: #616161; }
      .label { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; fill: #424242; }
      .tree-item { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 400; fill: #212121; }
      .tree-item-selected { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; fill: #1976D2; }
      .status-ok { fill: #4CAF50; }
      .status-nok { fill: #F44336; }
      .header-bg { fill: #1976D2; }
      .header-text { font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .user-info { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 400; fill: #FFFFFF; }
      .panel-bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .section-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
      .input-bg { fill: #FFFFFF; stroke: #BDBDBD; stroke-width: 1; }
      .button-text { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; fill: #FFFFFF; }
      .button-primary { fill: #1976D2; }
      .status-indicator { fill: #4CAF50; }
      .status-label { font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 500; fill: #4CAF50; }
      .detail-label { font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 500; fill: #757575; }
      .detail-value { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 400; fill: #212121; }
      .history-dot { fill: #4CAF50; }
      .history-dot-nok { fill: #F44336; }
    </style>
  </defs>

  <!-- Main Window Background -->
  <rect x="0" y="0" width="1400" height="900" fill="#FAFAFA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1400" height="60" class="header-bg"/>
  <text x="30" y="38" class="header-text">TENSIO METRO</text>
  <text x="1300" y="38" text-anchor="end" class="user-info">Operador: João Silva</text>

  <!-- Left Panel - Search & Filters -->
  <rect x="20" y="80" width="400" height="800" rx="4" class="panel-bg"/>

  <text x="40" y="110" class="title" font-size="18px">Programas Cadastrados</text>

  <!-- Search Field -->
  <text x="40" y="145" class="label">Buscar:</text>
  <rect x="40" y="155" width="360" height="35" rx="4" class="input-bg"/>
  <text x="50" y="178" class="subtitle">Digite para buscar...</text>

  <!-- Filters -->
  <text x="40" y="215" class="label">Filtros:</text>
  <rect x="40" y="225" width="175" height="30" rx="4" class="input-bg"/>
  <text x="50" y="245" class="subtitle">Últimas 10 ▼</text>

  <rect x="225" y="225" width="175" height="30" rx="4" class="input-bg"/>
  <text x="235" y="245" class="subtitle">Todos status ▼</text>

  <!-- Sort -->
  <text x="40" y="280" class="label">Ordenar por:</text>
  <rect x="40" y="290" width="360" height="30" rx="4" class="input-bg"/>
  <text x="50" y="310" class="subtitle">Nome do programa ▼</text>

  <!-- Tree View -->
  <rect x="40" y="330" width="360" height="430" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Tree Item 1 - Selected -->
  <rect x="42" y="332" width="356" height="45" fill="#E3F2FD"/>
  <text x="55" y="360" class="tree-item-selected">📁 STENCIL-ABC-123</text>

  <!-- Tree Item 2 -->
  <text x="55" y="410" class="tree-item">📁 STENCIL-XYZ-456</text>

  <!-- Tree Item 3 -->
  <text x="55" y="455" class="tree-item">📁 STENCIL-DEF-789</text>

  <!-- Tree Item 4 -->
  <text x="55" y="500" class="tree-item">📁 STENCIL-GHI-012</text>

  <!-- Tree Item 5 -->
  <text x="55" y="545" class="tree-item">📁 STENCIL-JKL-345</text>

  <!-- Tree Item 6 -->
  <text x="55" y="590" class="tree-item">📁 STENCIL-MNO-678</text>

  <!-- Tree Item 7 -->
  <text x="55" y="635" class="tree-item">📁 STENCIL-PQR-901</text>

  <!-- Barcode Button -->
  <rect x="40" y="780" width="360" height="45" rx="4" fill="#4CAF50"/>
  <text x="220" y="808" text-anchor="middle" class="button-text" font-size="15px">📷 Escanear Código de Barras</text>

  <!-- Right Panel - Details -->
  <rect x="440" y="80" width="940" height="800" rx="4" class="panel-bg"/>

  <text x="460" y="110" class="title" font-size="18px">Detalhes do Stencil</text>

  <!-- Details Grid -->
  <rect x="460" y="130" width="920" height="200" rx="4" class="section-bg"/>

  <text x="480" y="160" class="detail-label">Código:</text>
  <text x="560" y="160" class="detail-value" font-weight="500">STENCIL-ABC-123</text>

  <text x="480" y="190" class="detail-label">Modelo:</text>
  <text x="560" y="190" class="detail-value">500x500mm</text>

  <text x="480" y="220" class="detail-label">Fabricante:</text>
  <text x="560" y="220" class="detail-value">XYZ Stencils Ltda</text>

  <text x="480" y="250" class="detail-label">Última Medição:</text>
  <text x="610" y="250" class="detail-value">15/12/2025 às 14:30</text>

  <rect x="480" y="265" width="100" height="25" rx="4" class="status-ok"/>
  <text x="530" y="282" text-anchor="middle" class="button-text" font-size="12px">APROVADO</text>

  <text x="610" y="282" class="detail-label">Operador:</text>
  <text x="680" y="282" class="detail-value">Maria Santos</text>

  <!-- History Section -->
  <text x="480" y="360" class="title" font-size="16px">Histórico Recente (10 medições)</text>

  <rect x="460" y="375" width="920" height="100" rx="4" class="section-bg"/>

  <!-- History Dots -->
  <circle cx="490" cy="425" r="10" class="history-dot"/>
  <circle cx="530" cy="425" r="10" class="history-dot"/>
  <circle cx="570" cy="425" r="10" class="history-dot"/>
  <circle cx="610" cy="425" r="10" class="history-dot"/>
  <circle cx="650" cy="425" r="10" class="history-dot-nok"/>
  <circle cx="690" cy="425" r="10" class="history-dot"/>
  <circle cx="730" cy="425" r="10" class="history-dot"/>
  <circle cx="770" cy="425" r="10" class="history-dot"/>
  <circle cx="810" cy="425" r="10" class="history-dot-nok"/>
  <circle cx="850" cy="425" r="10" class="history-dot"/>

  <text x="480" y="455" class="detail-label">✓ = Aprovado | ✗ = Reprovado</text>

  <!-- Buttons -->
  <rect x="460" y="500" width="200" height="45" rx="4" fill="#9E9E9E"/>
  <text x="560" y="528" text-anchor="middle" class="button-text">Ver Histórico Completo</text>

  <rect x="680" y="500" width="200" height="45" rx="4" class="button-primary"/>
  <text x="780" y="528" text-anchor="middle" class="button-text" font-size="15px">Inspecionar Stencil →</text>

  <!-- Hardware Status -->
  <rect x="460" y="580" width="920" height="80" rx="4" class="section-bg"/>

  <text x="480" y="610" class="detail-label">Status do Hardware:</text>

  <circle cx="640" cy="605" r="6" class="status-indicator"/>
  <text x="655" y="610" class="status-label">PLC Conectado</text>

  <circle cx="800" cy="605" r="6" class="status-indicator"/>
  <text x="815" y="610" class="status-label">Tensiômetro Conectado</text>

  <circle cx="1000" cy="605" r="6" class="status-indicator"/>
  <text x="1015" y="610" class="status-label">Câmera Conectada</text>

  <rect x="460" y="690" width="920" height="180" rx="4" class="section-bg"/>
  <text x="480" y="720" class="detail-label">Informações Adicionais:</text>

  <text x="480" y="750" class="detail-value">• Total de medições: 45</text>
  <text x="480" y="775" class="detail-value">• Taxa de aprovação: 82%</text>
  <text x="480" y="800" class="detail-value">• Última reprovação: 08/12/2025</text>
  <text x="480" y="825" class="detail-value">• Próxima calibração: 20/01/2026</text>
</svg>
