  <text x="460" y="330" class="label">Reprovadas:</text>
  <text x="560" y="330" class="value" font-weight="700" fill="#F44336" font-size="16px">2 (20%)</text>

  <text x="680" y="330" class="label">Tensão média:</text>
  <text x="800" y="330" class="value" font-weight="700" font-size="16px">31.2 N/cm²</text>

  <text x="930" y="330" class="label">Mínima:</text>
