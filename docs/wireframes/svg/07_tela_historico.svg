  <rect x="330" y="200" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="345" y="220" class="value">Aprovados ▼</text>
  <rect x="425" y="200" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="440" y="220" class="value">Reprovados ▼</text>

