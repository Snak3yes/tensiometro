  <text x="70" y="300" class="title" font-size="15px">Estatísticas do Período Selecionado</text>

  <text x="70" y="330" class="label">Total de medições:</text>
  <text x="200" y="330" class="value" font-weight="700" font-size="16px">10</text>

  <text x="260" y="330" class="label">Aprovadas:</text>
