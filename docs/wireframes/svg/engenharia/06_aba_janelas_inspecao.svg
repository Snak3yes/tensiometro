<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; fill: #1976D2; }
      .subtitle { font-family: 'Roboto', sans-serif; font-size: 16px; font-weight: 400; fill: #616161; }
      .label { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; fill: #424242; }
      .body-text { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 400; fill: #616161; }
      .small-text { font-family: 'Roboto', sans-serif; font-size: 11px; font-weight: 400; fill: #6B7280; }
      .button-text { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; fill: #FFFFFF; }
      .cancel-text { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; fill: #757575; }
      .tab-text { font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 500; }
      .dialog-bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .overlay-bg { fill: #000000; opacity: 0.5; }
      .card-bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .panel-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
      .button-primary { fill: #1976D2; }
      .button-secondary { fill: #F5F5F5; stroke: #BDBEBD; stroke-width: 1; }
      .tab-active { fill: #1976D2; }
      .tab-complete { fill: #4CAF50; }
      .tab-pending { fill: #E0E0E0; }
      .group-tree { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .group-item { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
      .input-field { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    </style>
  </defs>

  <!-- Overlay Background -->
  <rect x="0" y="0" width="1400" height="900" class="overlay-bg"/>

  <!-- Dialog Shadow -->
  <rect x="100" y="50" width="1200" height="800" rx="8" fill="#000000" opacity="0.1"/>

  <!-- Main Dialog -->
  <rect x="100" y="50" width="1200" height="800" rx="8" class="dialog-bg"/>

  <!-- Title -->
  <text x="700" y="95" text-anchor="middle" class="title">Criar Programa de Inspeção Visual</text>

  <!-- Tab Navigation -->
  <g transform="translate(120, 120)">
    <rect x="0" y="0" width="150" height="40" rx="4" class="tab-complete"/>
    <text x="75" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">✓ 1. Dados</text>

    <rect x="160" y="0" width="150" height="40" rx="4" class="tab-complete"/>
    <text x="235" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">✓ 2. Gerber</text>

    <rect x="320" y="0" width="150" height="40" rx="4" class="tab-complete"/>
    <text x="395" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">✓ 3. Fiduciais</text>

    <rect x="480" y="0" width="150" height="40" rx="4" class="tab-complete"/>
    <text x="555" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">✓ 4. Posição</text>

    <rect x="640" y="0" width="150" height="40" rx="4" class="tab-complete"/>
    <text x="715" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">✓ 5. Alinhamento</text>

    <rect x="800" y="0" width="150" height="40" rx="4" class="tab-active"/>
    <text x="875" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">6. Janelas</text>

    <rect x="960" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="1035" y="25" text-anchor="middle" class="tab-text" fill="#757575">7. Confirmar</text>
  </g>

  <!-- Content Area -->
  <g transform="translate(140, 190)">
    <!-- Section Title -->
    <text x="0" y="0" class="title" font-size="20px">Configuração de Janelas de Inspeção</text>
    <text x="0" y="25" class="subtitle">Configure os parâmetros de inspeção para cada grupo de aberturas.</text>

    <!-- Left Panel: Group Tree -->
    <rect x="0" y="60" width="400" height="520" rx="8" class="card-bg"/>

    <text x="20" y="90" class="title" font-size="16px">📦 Grupos de Aberturas</text>

    <!-- Toolbar -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="90" height="30" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
      <text x="45" y="20" text-anchor="middle" class="small-text" fill="#1976D2">Expandir Todos</text>

      <rect x="100" y="0" width="100" height="30" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
      <text x="150" y="20" text-anchor="middle" class="small-text" fill="#1976D2">Recolher Todos</text>

      <rect x="210" y="0" width="90" height="30" rx="4" fill="#4CAF50"/>
      <text x="255" y="20" text-anchor="middle" class="small-text" fill="#FFFFFF">Auto-Agrupar</text>
    </g>

    <!-- Group 1: 0.5mm (CONFIRMED) -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="360" height="80" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
      <text x="15" y="20" class="label" font-size="14px" fill="#4CAF50">📦 0.5mm (145) ✅</text>

      <text x="15" y="45" class="small-text">├─ ✓ Padrão (142)</text>
      <text x="15" y="60" class="small-text">└─ ⚙️ Exceções (3)</text>
      <text x="15" y="75" class="small-text" fill="#4CAF50">   └─ ID=45, ID=78, ID=112</text>
    </g>

    <!-- Group 2: 0.8mm (CONFIGURED) -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="360" height="65" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
      <text x="15" y="20" class="label" font-size="14px" fill="#1976D2">📦 0.8mm (82) 🟢</text>

      <text x="15" y="40" class="small-text">└─ ✓ Padrão (82)</text>
      <text x="15" y="55" class="small-text" fill="#1976D2">Configurado, não confirmado</text>
    </g>

    <!-- Group 3: 1.2mm (PENDING) -->
    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="360" height="65" rx="4" class="group-item"/>
      <text x="15" y="20" class="label" font-size="14px">📦 1.2mm (23) ⚪</text>

      <text x="15" y="40" class="small-text">└─ ⚪ Não configurado</text>
      <text x="15" y="55" class="small-text" fill="#757575">Aguardando configuração</text>
    </g>

    <!-- Group 4: 2.0mm (PENDING) -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="360" height="65" rx="4" class="group-item"/>
      <text x="15" y="20" class="label" font-size="14px">📦 2.0mm (12) ⚪</text>

      <text x="15" y="40" class="small-text">└─ ⚪ Não configurado</text>
      <text x="15" y="55" class="small-text" fill="#757575">Aguardando configuração</text>
    </g>

    <!-- Group 5: Obround (PENDING) -->
    <g transform="translate(20, 470)">
      <rect x="0" y="0" width="360" height="65" rx="4" class="group-item"/>
      <text x="15" y="20" class="label" font-size="14px">📦 Oblong_3x1 (8) ⚪</text>

      <text x="15" y="40" class="small-text">└─ ⚪ Não configurado</text>
      <text x="15" y="55" class="small-text" fill="#757575">Aguardando configuração</text>
    </g>
  </g>

  <!-- Right Panel: Configuration -->
  <g transform="translate(560, 190)">
    <rect x="0" y="60" width="700" height="520" rx="8" class="panel-bg"/>

    <text x="25" y="100" class="title" font-size="16px">⚙️ Configuração: Grupo 0.5mm</text>

    <!-- Group Info -->
    <g transform="translate(25, 125)">
      <text x="0" y="0" class="label">Quantidade:</text>
      <text x="100" y="0" class="body-text" font-weight="700">145 aberturas</text>

      <text x="200" y="0" class="label">Dimensão:</text>
      <text x="280" y="0" class="body-text">0.5 × 0.5 mm</text>
    </g>

    <!-- Thresholds -->
    <g transform="translate(25, 155)">
      <text x="0" y="0" class="label">Threshold OK (%):</text>
      <rect x="150" y="-15" width="100" height="24" rx="2" class="input-field"/>
      <text x="200" y="2" text-anchor="middle" class="body-text">90</text>

      <text x="270" y="0" class="label">Threshold PARTIAL (%):</text>
      <rect x="445" y="-15" width="100" height="24" rx="2" class="input-field"/>
      <text x="495" y="2" text-anchor="middle" class="body-text">70</text>
    </g>

    <!-- Binarization -->
    <g transform="translate(25, 200)">
      <text x="0" y="0" class="label">Método de Binarização:</text>
      <rect x="150" y="-15" width="200" height="24" rx="2" class="input-field"/>
      <text x="160" y="2" class="body-text">Otsu</text>
      <text x="330" y="2" class="small-text" fill="#757575">▼</text>

      <text x="270" y="0" class="label">Pré-processamento:</text>
      <rect x="410" y="-15" width="150" height="24" rx="2" class="input-field"/>
      <text x="420" y="2" class="body-text">Blur 3x3</text>
      <text x="540" y="2" class="small-text" fill="#757575">▼</text>
    </g>

    <!-- Preview -->
    <g transform="translate(25, 245)">
      <text x="0" y="0" class="label">Preview Visual (3 exemplos do grupo):</text>

      <rect x="0" y="15" width="200" height="200" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <!-- Preview 1 -->
      <rect x="10" y="25" width="50" height="50" fill="#4CAF50" stroke="#4CAF50" stroke-width="2"/>
      <text x="35" y="55" text-anchor="middle" class="small-text" fill="#FFFFFF">✓</text>

      <!-- Preview 2 -->
      <rect x="75" y="25" width="50" height="50" fill="#4CAF50" stroke="#4CAF50" stroke-width="2"/>
      <text x="100" y="55" text-anchor="middle" class="small-text" fill="#FFFFFF">✓</text>

      <!-- Preview 3 -->
      <rect x="140" y="25" width="50" height="50" fill="#FFC107" stroke="#FFC107" stroke-width="2"/>
      <text x="165" y="55" text-anchor="middle" class="small-text" fill="#FFFFFF">⚠</text>

      <!-- Info text -->
      <text x="100" y="180" text-anchor="middle" class="small-text" fill="#757575">2 OK | 1 PARTIAL</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(25, 475)">
      <rect x="0" y="0" width="160" height="40" rx="4" fill="#1976D2"/>
      <text x="80" y="25" text-anchor="middle" class="button-text" font-size="12px">Aplicar a Todas</text>

      <rect x="175" y="0" width="160" height="40" rx="4" fill="#4CAF50"/>
      <text x="255" y="25" text-anchor="middle" class="button-text" font-size="12px">✓ Confirmar Grupo</text>

      <rect x="350" y="0" width="160" height="40" rx="4" fill="#FF9800"/>
      <text x="430" y="25" text-anchor="middle" class="button-text" font-size="12px">⚙️ Exceção</text>

      <rect x="525" y="0" width="160" height="40" rx="4" fill="#9C27B0"/>
      <text x="605" y="25" text-anchor="middle" class="button-text" font-size="12px">💾 Salvar na Biblioteca</text>
    </g>

    <!-- Library Section -->
    <g transform="translate(25, 525)">
      <rect x="0" y="0" width="650" height="40" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
      <text x="15" y="25" class="label" font-size="11px" fill="#1976D2">
        📚 Biblioteca: 3 configs disponíveis | [0.5mm Padrão] [0.8mm Padrão] [1.2mm Padrão]
      </text>
    </g>
  </g>

  <!-- Footer Buttons -->
  <g transform="translate(120, 770)">
    <rect x="0" y="0" width="120" height="40" rx="4" class="button-secondary"/>
    <text x="60" y="25" text-anchor="middle" class="cancel-text">Cancelar</text>

    <rect x="840" y="0" width="120" height="40" rx="4" class="button-secondary"/>
    <text x="900" y="25" text-anchor="middle" class="cancel-text">← Anterior</text>

    <rect x="970" y="0" width="120" height="40" rx="4" fill="#BDBEBD"/>
    <text x="1030" y="25" text-anchor="middle" class="cancel-text">Próximo →</text>
  </g>

  <!-- Help Button -->
  <circle cx="1250" cy="790" r="20" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="1250" y="796" text-anchor="middle" class="label" font-size="16px" fill="#1976D2">?</text>
</svg>
