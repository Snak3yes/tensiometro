<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; fill: #1976D2; }
      .subtitle { font-family: 'Roboto', sans-serif; font-size: 16px; font-weight: 400; fill: #616161; }
      .label { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; fill: #424242; }
      .body-text { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 400; fill: #616161; }
      .small-text { font-family: 'Roboto', sans-serif; font-size: 11px; font-weight: 400; fill: #6B7280; }
      .button-text { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; fill: #FFFFFF; }
      .cancel-text { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; fill: #757575; }
      .tab-text { font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 500; }
      .dialog-bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .overlay-bg { fill: #000000; opacity: 0.5; }
      .card-bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .panel-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
      .button-primary { fill: #1976D2; }
      .button-secondary { fill: #F5F5F5; stroke: #BDBEBD; stroke-width: 1; }
      .tab-active { fill: #1976D2; }
      .tab-complete { fill: #4CAF50; }
      .tab-pending { fill: #E0E0E0; }
      .input-field { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .info-box { fill: #E3F2FD; stroke: #1976D2; stroke-width: 1; }
    </style>
  </defs>

  <!-- Overlay Background -->
  <rect x="0" y="0" width="1400" height="900" class="overlay-bg"/>

  <!-- Dialog Shadow -->
  <rect x="100" y="50" width="1200" height="800" rx="8" fill="#000000" opacity="0.1"/>

  <!-- Main Dialog -->
  <rect x="100" y="50" width="1200" height="800" rx="8" class="dialog-bg"/>

  <!-- Title -->
  <text x="700" y="95" text-anchor="middle" class="title">Criar Programa de Inspeção Visual</text>

  <!-- Tab Navigation -->
  <g transform="translate(120, 120)">
    <!-- Tab 1: Dados (ACTIVE) -->
    <rect x="0" y="0" width="150" height="40" rx="4" class="tab-active"/>
    <text x="75" y="25" text-anchor="middle" class="tab-text" fill="#FFFFFF">1. Dados</text>

    <!-- Tab 2: Gerber (PENDING) -->
    <rect x="160" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="235" y="25" text-anchor="middle" class="tab-text" fill="#757575">2. Gerber</text>

    <!-- Tab 3: Fiduciais (PENDING) -->
    <rect x="320" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="395" y="25" text-anchor="middle" class="tab-text" fill="#757575">3. Fiduciais</text>

    <!-- Tab 4: Posição (PENDING) -->
    <rect x="480" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="555" y="25" text-anchor="middle" class="tab-text" fill="#757575">4. Posição</text>

    <!-- Tab 5: Alinhamento (PENDING) -->
    <rect x="640" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="715" y="25" text-anchor="middle" class="tab-text" fill="#757575">5. Alinhamento</text>

    <!-- Tab 6: Janelas (PENDING) -->
    <rect x="800" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="875" y="25" text-anchor="middle" class="tab-text" fill="#757575">6. Janelas</text>

    <!-- Tab 7: Confirmar (PENDING) -->
    <rect x="960" y="0" width="150" height="40" rx="4" class="tab-pending"/>
    <text x="1035" y="25" text-anchor="middle" class="tab-text" fill="#757575">7. Confirmar</text>
  </g>

  <!-- Content Area -->
  <g transform="translate(140, 190)">
    <!-- Section Title -->
    <text x="0" y="0" class="title" font-size="20px">Dados do Programa</text>
    <text x="0" y="25" class="subtitle">Preencha as informações básicas do programa de inspeção visual.</text>

    <!-- Form Container -->
    <rect x="0" y="50" width="580" height="450" rx="8" class="card-bg"/>

    <!-- Field 1: Código do Stencil -->
    <text x="30" y="90" class="label">Código do Stencil *</text>
    <rect x="30" y="105" width="520" height="40" rx="4" class="input-field"/>
    <text x="45" y="130" class="body-text" fill="#9E9E9E">STENCIL-ABC-123</text>
    <text x="520" y="130" text-anchor="end" class="small-text" fill="#1976D2">🔍 Buscar</text>

    <!-- Field 2: Nome do Programa -->
    <text x="30" y="175" class="label">Nome do Programa de Inspeção *</text>
    <rect x="30" y="190" width="520" height="40" rx="4" class="input-field"/>
    <text x="45" y="215" class="body-text" fill="#9E9E9E">Inspeção Padrão - 0.5mm</text>

    <!-- Field 3: Receita Base -->
    <text x="30" y="260" class="label">Receita Base (opcional)</text>
    <rect x="30" y="275" width="520" height="40" rx="4" class="input-field"/>
    <text x="45" y="300" class="body-text" fill="#9E9E9E">Selecione uma receita...</text>
    <text x="520" y="300" text-anchor="end" class="small-text" fill="#757575">▼</text>

    <!-- Button: Cadastrar Novo Stencil -->
    <rect x="30" y="340" width="250" height="45" rx="4" fill="#4CAF50"/>
    <text x="155" y="367" text-anchor="middle" class="button-text">➕ Cadastrar Novo Stencil</text>

    <!-- Info Box -->
    <rect x="300" y="340" width="250" height="90" rx="4" class="info-box"/>
    <text x="315" y="365" class="label" font-size="11px" fill="#1976D2">ℹ️ Instruções:</text>
    <text x="315" y="385" class="small-text" fill="#1976D2">• Código único do stencil</text>
    <text x="315" y="400" class="small-text" fill="#1976D2">• Nome descritivo do programa</text>
    <text x="315" y="415" class="small-text" fill="#1976D2">• Receita define limites de aceitação</text>

    <!-- Validation Status -->
    <rect x="30" y="450" width="520" height="40" rx="4" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
    <text x="45" y="475" class="label" font-size="11px" fill="#E65100">⚠️ Campos obrigatórios não preenchidos</text>
  </g>

  <!-- Right Panel: Instructions -->
  <g transform="translate(750, 190)">
    <rect x="0" y="50" width="510" height="450" rx="8" class="panel-bg"/>

    <text x="25" y="90" class="title" font-size="16px">📋 Informações do Stencil</text>

    <!-- Stencil Preview -->
    <rect x="25" y="120" width="460" height="120" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

    <g transform="translate(45, 140)">
      <text x="0" y="0" class="label">Código:</text>
      <text x="200" y="0" class="body-text" font-weight="700">STENCIL-ABC-123</text>

      <text x="0" y="25" class="label">Descrição:</text>
      <text x="200" y="25" class="body-text">Stencil principal linha A</text>

      <text x="0" y="50" class="label">Receita Atual:</text>
      <text x="200" y="50" class="body-text">Padrão 0.5mm</text>

      <text x="0" y="75" class="label">Status:</text>
      <text x="200" y="75" class="body-text" fill="#4CAF50" font-weight="700">🟢 Ativo</text>
    </g>

    <!-- Steps Info -->
    <text x="25" y="280" class="title" font-size="16px">📝 Próximos Passos</text>

    <rect x="25" y="300" width="460" height="180" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

    <g transform="translate(45, 325)">
      <circle cx="10" cy="10" r="12" fill="#E0E0E0"/>
      <text x="10" y="15" text-anchor="middle" class="label" font-size="11px">1</text>
      <text x="35" y="15" class="body-text">Carregar arquivo Gerber</text>

      <circle cx="10" cy="45" r="12" fill="#E0E0E0"/>
      <text x="10" y="50" text-anchor="middle" class="label" font-size="11px">2</text>
      <text x="35" y="50" class="body-text">Definir fiduciais de referência</text>

      <circle cx="10" cy="80" r="12" fill="#E0E0E0"/>
      <text x="10" y="85" text-anchor="middle" class="label" font-size="11px">3</text>
      <text x="35" y="85" class="body-text">Posicionar máquina e capturar</text>

      <circle cx="10" cy="115" r="12" fill="#E0E0E0"/>
      <text x="10" y="120" text-anchor="middle" class="label" font-size="11px">4</text>
      <text x="35" y="120" class="body-text">Alinhar Gerber com imagem</text>

      <circle cx="10" cy="150" r="12" fill="#E0E0E0"/>
      <text x="10" y="155" text-anchor="middle" class="label" font-size="11px">5</text>
      <text x="35" y="155" class="body-text">Configurar janelas de inspeção</text>
    </g>
  </g>

  <!-- Footer Buttons -->
  <g transform="translate(120, 770)">
    <rect x="0" y="0" width="120" height="40" rx="4" class="button-secondary"/>
    <text x="60" y="25" text-anchor="middle" class="cancel-text">Cancelar</text>

    <rect x="960" y="0" width="120" height="40" rx="4" fill="#BDBEBD"/>
    <text x="1020" y="25" text-anchor="middle" class="cancel-text">← Anterior</text>

    <rect x="1090" y="0" width="120" height="40" rx="4" class="button-primary"/>
    <text x="1150" y="25" text-anchor="middle" class="button-text">Próximo →</text>
  </g>

  <!-- Help Button -->
  <circle cx="1250" cy="790" r="20" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="1250" y="796" text-anchor="middle" class="label" font-size="16px" fill="#1976D2">?</text>
</svg>
