  <rect x="720" y="150" width="140" height="30" rx="4" class="button-secondary"/>
  <text x="790" y="170" text-anchor="middle" class="button-text">Exportar CSV</text>

  <rect x="880" y="150" width="140" height="30" rx="4" class="button-primary"/>
  <text x="950" y="170" text-anchor="middle" class="button-text">Gerar PDF</text>

  <rect x="1040" y="150" width="140" height="30" rx="4" class="button-secondary"/>
  <text x="1110" y="170" text-anchor="middle" class="button-text">Buscar no Histórico</text>

  <!-- Statistics -->
