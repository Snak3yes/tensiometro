<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Roboto', sans-serif; font-size: 22px; font-weight: 700; fill: #1976D2; }
      .subtitle { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 400; fill: #616161; }
      .label { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; fill: #424242; }
      .value { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 400; fill: #212121; }
      .table-header { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 700; fill: #424242; }
      .table-text { font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 400; fill: #212121; }
      .button-text { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; fill: #FFFFFF; }
      .header-bg { fill: #1976D2; }
      .header-text { font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .panel-bg { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
      .section-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
      .dropdown-bg { fill: #FFFFFF; stroke: #BDBEBD; stroke-width: 1; }
      .button-primary { fill: #1976D2; }
      .button-secondary { fill: #4CAF50; }
      .button-cancel { fill: #F5F5F5; stroke: #BDBEBD; stroke-width: 1; }
      .status-auto { fill: #4CAF50; } /* Verde vibrante - Aprovado Auto */
      .status-user { fill: #CDDC39; } /* Verde-amarelo - Aprovado User */
      .status-nok { fill: #F44336; } /* Vermelho - Reprovado */
      .table-row-even { fill: #FFFFFF; }
      .table-row-odd { fill: #F5F5F5; }
      .stat-box { fill: #E3F2FD; stroke: #1976D2; stroke-width: 1; }
      .badge-auto { fill: #4CAF50; }
      .badge-user { fill: #CDDC39; }
      .badge-nok { fill: #F44336; }
    </style>
