  <!-- Main Window Background -->
  <rect x="0" y="0" width="1400" height="1000" fill="#FAFAFA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1400" height="60" class="header-bg"/>
  <text x="30" y="38" class="header-text">Histórico de Medições - STENCIL-ABC-123</text>

  <!-- Main Content Area -->
  <rect x="20" y="80" width="1360" height="920" rx="4" class="panel-bg"/>

  <!-- Filters Section -->
  <rect x="50" y="100" width="600" height="150" rx="4" class="section-bg"/>

  <text x="70" y="130" class="title" font-size="15px">Filtros</text>

  <text x="70" y="165" class="label">Período:</text>
  <rect x="140" y="155" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="155" y="175" class="value">Últimas 10 ▼</text>

  <rect x="330" y="155" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="345" y="175" class="value">7 dias ▼</text>
  <rect x="425" y="155" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="440" y="175" class="value">30 dias ▼</text>

  <text x="70" y="210" class="label">Status:</text>
  <rect x="140" y="200" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="155" y="220" class="value">Todos os status ▼</text>

  <rect x="330" y="200" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="345" y="220" class="value">Aprovados ▼</text>
  <rect x="425" y="200" width="175" height="30" rx="4" class="dropdown-bg"/>
  <text x="440" y="220" class="value">Reprovados ▼</text>

  <!-- Export Buttons -->
