  <text x="70" y="300" class="title" font-size="15px">Estatísticas do Período Selecionado</text>

  <text x="70" y="330" class="label">Total de medições:</text>
  <text x="200" y="330" class="value" font-weight="700" font-size="16px">10</text>

  <text x="260" y="330" class="label">Aprovadas:</text>
  <text x="350" y="330" class="value" font-weight="700" fill="#4CAF50" font-size="16px">8 (80%)</text>

  <text x="460" y="330" class="label">Reprovadas:</text>
  <text x="560" y="330" class="value" font-weight="700" fill="#F44336" font-size="16px">2 (20%)</text>

  <text x="70" y="355" class="label">Aprovadas Auto:</text>
  <text x="190" y="355" class="value" font-weight="700" fill="#4CAF50" font-size="14px">5</text>

  <text x="270" y="355" class="label">Aprovadas User:</text>
  <text x="400" y="355" class="value" font-weight="700" fill="#CDDC39" font-size="14px">3</text>

  <text x="520" y="355" class="label">Tensão média:</text>
  <text x="640" y="355" class="value" font-weight="700" font-size="15px">31.2 N/cm²</text>

  <text x="780" y="355" class="label">Operadores:</text>
  <text x="890" y="355" class="value">João Silva, Maria Santos</text>

  <!-- Table Section -->
  <rect x="50" y="390" width="1290" height="520" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>

